plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'fr.rearguard'
    compileSdk 34

    defaultConfig {
        applicationId "fr.rearguard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signé avec la clé de debug : suffisant pour une installation manuelle
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    androidResources { noCompress 'tflite' }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// ---- Téléchargement automatique du modèle de détection (EfficientDet-Lite0, COCO) ----
def modelFile = file("src/main/assets/vehicle_detector.tflite")
def modelUrls = [
    'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite',
    'https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite'
]
tasks.register('downloadModel') {
    outputs.file(modelFile)
    doLast {
        if (modelFile.exists() && modelFile.length() > 100000) return
        modelFile.parentFile.mkdirs()
        def ok = false
        for (u in modelUrls) {
            try {
                println "Téléchargement du modèle : $u"
                URI.create(u).toURL().withInputStream { i -> modelFile.withOutputStream { it << i } }
                if (modelFile.length() > 100000) { ok = true; break }
            } catch (Exception e) {
                println "Échec : ${e.message}"
            }
        }
        if (!ok) throw new GradleException("Impossible de télécharger le modèle. Placez un fichier efficientdet_lite0.tflite dans app/src/main/assets/vehicle_detector.tflite")
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'downloadModel' }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
