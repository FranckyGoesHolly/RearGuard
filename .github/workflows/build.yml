name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RearGuard-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publier l'APK dans la branche apk
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/release/app-release.apk /tmp/out/RearGuard.apk
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add RearGuard.apk
          git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
